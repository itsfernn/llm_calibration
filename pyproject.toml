[project]
name = "calibration-thesis"
version = "0.1.0"
description = "Calibration of verbalized confidence in LLMs: experiments, scaling methods, and evaluation."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # core evaluation library
    "marimo>=0.23.14",
    "matplotlib>=3.11.0",
    "netcal>=1.4.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    # data extraction: MHQA experiments (experiments/mhqa/) — ported from the legacy repo
    "backoff>=2.2",
    "datasets>=3.0",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "langchain-together>=0.3",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
    "wandb>=0.19",
    # data extraction: local Qwen model runs (experiments/qwen/)
    "accelerate>=1.0",
    "torch>=2.5",
    "transformers>=4.46",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.marimo.runtime]
pythonpath = ["."]
